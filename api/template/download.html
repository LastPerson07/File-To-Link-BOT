<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ file_name }}</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/TelegramPlayGround/TG-API@main/webapp/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0c10;
            --card: #1f2833;
            --accent: #66fcf1;
            --accent-dark: #45a29e;
            --text: #c5c6c7;
            --text-light: #ffffff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 16px 20px;
            background: rgba(31, 40, 51, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(102, 252, 241, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand {
            font-weight: 800;
            color: var(--accent);
            font-size: 1.1rem;
            text-decoration: none;
        }
        .support-btn {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 14px;
            border: 1px solid var(--accent-dark);
            border-radius: 8px;
            transition: 0.2s;
        }
        .support-btn:hover { background: var(--accent-dark); color: #000; }
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 560px;
            background: var(--card);
            border-radius: 18px;
            padding: 32px;
            text-align: center;
            border: 1px solid rgba(102, 252, 241, 0.12);
            box-shadow: 0 12px 45px rgba(0,0,0,0.45);
        }
        .icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 16px;
        }
        .file-title {
            color: var(--text-light);
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0 0 14px;
            word-break: break-word;
        }
        .meta {
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 0.95rem;
            color: var(--text);
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .meta span { display: flex; align-items: center; gap: 6px; }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: transform 0.15s, opacity 0.15s;
        }
        .btn:hover { transform: translateY(-2px); opacity: 0.92; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-telegram { background: #229ed9; color: #fff; }
        .note {
            margin-top: 20px;
            padding: 12px 14px;
            background: rgba(102, 252, 241, 0.06);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #d0d0d0;
            text-align: left;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #6c757d;
            border-top: 1px solid rgba(102, 252, 241, 0.08);
        }
        footer a { color: var(--accent); text-decoration: none; }
        @media (max-width: 480px) {
            .card { padding: 24px 18px; }
            .file-title { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand"><i class="fa-solid fa-cloud-arrow-down"></i> StreamHub</a>
        <a href="tg://resolve?domain=LastPerson07" class="support-btn"><i class="fa-brands fa-telegram"></i> Support</a>
    </header>

    <main>
        <div class="card">
            <div class="icon"><i class="fa-solid fa-file-zipper"></i></div>
            <h1 class="file-title">{{ file_name }}</h1>
            <div class="meta">
                <span><i class="fa-solid fa-weight-hanging"></i> {{ file_size }}</span>
                <span><i class="fa-solid fa-fingerprint"></i> {{ file_unique_id[:12] }}</span>
            </div>

            <div class="actions">
                <a class="btn btn-primary" href="{{ file_url }}" download><i class="fa-solid fa-download"></i> Download Now</a>
                <a class="btn btn-telegram" href="{{ file_get }}" target="_blank"><i class="fa-brands fa-telegram"></i> Open in Telegram</a>
            </div>

            <div class="note">
                <i class="fa-solid fa-shield-halved"></i>
                This file is streamed directly from Telegram storage. If your download fails, open it in Telegram instead.
            </div>
        </div>
    </main>

    <footer>
        <p>Powered by <a href="https://t.me/LastPerson07">LastPerson07</a></p>
    </footer>
</body>
</html>
